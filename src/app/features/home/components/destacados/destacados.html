<section
  aria-label="Productos destacados"
  class="mx-auto max-w-screen-2xl px-6 py-12 md:px-16 md:py-16 lg:px-24 xl:px-32"
>
  <div class="mb-8 border-b border-gray-200 pb-6 md:mb-10">
    <div class="mb-3 flex items-center gap-3" aria-hidden="true">
      <span class="h-0.5 w-8 bg-indigo-600"></span>
      <span class="h-0.5 w-2 bg-indigo-300"></span>
    </div>
    <h2 class="text-2xl font-bold uppercase italic leading-tight tracking-tight text-gray-900 sm:text-3xl md:text-4xl">
      Productos <span class="text-indigo-600">destacados</span>
    </h2>
    <p class="mt-3 max-w-lg text-sm leading-6 text-gray-600 sm:text-base">
      Conocé algunos de nuestros productos seleccionados.
    </p>
  </div>

  <div class="grid grid-cols-1 items-stretch gap-6 sm:grid-cols-2 xl:grid-cols-3">
    @for (producto of productosDestacados(); track producto.id) {
      <app-card-product
        class="block h-full min-w-0"
        [producto]="producto"
        (agregarAlCarrito)="agregarAlCarrito.emit($event)"
      />
    } @empty {
      <div class="col-span-full rounded-xl border border-dashed border-gray-300 bg-white px-6 py-12 text-center">
        <p class="text-base font-semibold text-gray-900">No hay productos destacados disponibles.</p>
        <p class="mt-2 text-sm leading-6 text-gray-600">Volvé pronto para conocer nuestra selección.</p>
      </div>
    }
  </div>
</section>
