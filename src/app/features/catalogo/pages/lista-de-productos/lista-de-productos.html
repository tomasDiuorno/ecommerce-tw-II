<h2>Lista de Productos</h2>

<div class="grid-productos">
<div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
  @for (producto of productos(); track producto.id) {
    <app-card-product [producto]="producto" (agregarAlCarrito)="onAgregarAlCarrito($event)" />
  }@empty {
  <p class="col-span-full rounded-xl border border-dashed border-gray-300 bg-white px-6 py-12 text-center text-gray-600">
    Todavía no hay productos en esta categoría.
  </p>
}
</div>
</div>
