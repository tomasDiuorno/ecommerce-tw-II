<article
  class="group/card flex h-full min-w-0 flex-col overflow-hidden rounded-xl border border-gray-200 bg-white transition-colors duration-200 hover:border-indigo-300 focus-within:border-indigo-400 motion-reduce:transition-none"
>
  <a
    [routerLink]="['/catalogo', producto().id]"
    [attr.aria-label]="'Ver detalle de ' + producto().nombre"
    class="block rounded-t-xl p-5 pb-0 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[-4px] focus-visible:outline-indigo-600 sm:p-6 sm:pb-0"
  >
    <div class="relative aspect-[4/3] overflow-hidden rounded-lg bg-white">
      <img
        [src]="producto().imagen"
        [alt]="producto().nombre"
        loading="lazy"
        decoding="async"
        class="absolute inset-0 h-full w-full object-contain p-3 transition-transform duration-300 group-hover/card:scale-105 motion-reduce:transform-none motion-reduce:transition-none"
      />
    </div>
    <div class="mt-5 border-t border-gray-100 pt-5">
      <span class="text-xs font-semibold uppercase tracking-widest text-indigo-700">
        {{ producto().categoria }}
      </span>
      <h3 class="mt-2 break-words text-lg font-semibold leading-snug text-gray-900 transition-colors group-hover/card:text-indigo-700 motion-reduce:transition-none">
        {{ producto().nombre }}
      </h3>
      <p class="mt-2 line-clamp-2 text-sm leading-6 text-gray-600">
        {{ producto().descripcion }}
      </p>
    </div>
  </a>

  <div class="mt-auto p-5 pt-5 sm:p-6">
    <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
      <span class="text-2xl font-bold tracking-tight text-gray-900">
        {{ producto().precio | currency: 'ARS' : 'symbol-narrow' : '1.0-0' }}
      </span>
      <span
        class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-medium"
        [class]="producto().disponible ? 'bg-emerald-50 text-emerald-800' : 'bg-gray-100 text-gray-600'"
      >
        <span class="size-1.5 rounded-full bg-current" aria-hidden="true"></span>
        {{ producto().disponible ? 'Disponible' : 'No disponible' }}
      </span>
    </div>

    <button
      type="button"
      [disabled]="!producto().disponible"
      (click)="agregarAlCarrito.emit(producto()); $event.stopPropagation()"
      [attr.aria-label]="producto().disponible ? 'Agregar ' + producto().nombre + ' al carrito' : producto().nombre + ' no disponible'"
      class="inline-flex min-h-11 w-full cursor-pointer items-center justify-center gap-2 rounded-md bg-indigo-600 px-4 py-3 text-sm font-semibold text-white transition-colors duration-200 enabled:hover:bg-indigo-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:cursor-not-allowed disabled:bg-gray-100 disabled:text-gray-600 motion-reduce:transition-none"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 576 512"
        class="size-4 shrink-0 fill-current"
        aria-hidden="true"
      >
        <path d="M0 24C0 10.7 10.7 0 24 0H69.5c22 0 41.5 12.8 50.6 32h411c26.3 0 45.5 25 38.6 50.4l-41 152.3c-8.5 31.4-37 53.3-69.5 53.3H170.7l5.4 28.5c2.2 11.3 12.1 19.5 23.6 19.5H488c13.3 0 24 10.7 24 24s-10.7 24-24 24H199.7c-34.6 0-64.3-24.6-70.7-58.5L77.4 54.5c-.7-3.8-4-6.5-7.9-6.5H24C10.7 48 0 37.3 0 24zM128 464a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm336-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z" />
      </svg>
      {{ producto().disponible ? 'Agregar al carrito' : 'No disponible' }}
    </button>
  </div>
</article>
