
services:
  db:
    image: postgres:17-alpine
    container_name: taller-web-II-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller_user -d taller_web"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
