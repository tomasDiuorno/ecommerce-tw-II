<div class="max-w-2xl mx-auto px-6 py-20 text-center">

  <div class="bg-white border border-gray-200 rounded-lg p-10 shadow-sm">

    <div class="text-5xl text-green-600 mb-5">
      ✓
    </div>

    <h1 class="text-3xl font-bold mb-4">
      ¡Compra realizada con éxito!
    </h1>

    <p class="text-gray-600 mb-6">
      Tu pedido fue registrado correctamente.
    </p>

    @if (compra) {
    <div class="bg-gray-50 rounded-lg p-5 mb-8">
      <p class="text-gray-600">
        Número de pedido
      </p>

      <p class="text-2xl font-bold text-indigo-600 mb-4">
        #{{ compra.id }}
      </p>

      <p class="text-gray-600">
        Total de la compra
      </p>

      <p class="text-2xl font-bold">
        ${{ compra.total }}
      </p>
    </div>
    }

    <p class="text-sm text-gray-500 mb-8">
      Gracias por comprar en Compra Gueimer.
    </p>

    <a routerLink="/" class="inline-block bg-indigo-500 text-white px-8 py-3
             rounded-md hover:bg-indigo-600 transition-colors">
      Volver al inicio
    </a>

  </div>

</div>
